global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Agent runs on the host loopback; Prometheus shares host networking.
  - job_name: agent
    static_configs:
      - targets: ['127.0.0.1:8787']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: otel-collector
    static_configs:
      - targets: ['127.0.0.1:8888']
    scrape_interval: 15s

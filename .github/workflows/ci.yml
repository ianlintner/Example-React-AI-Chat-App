name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Local-development-only stack. No hosting, deploy, cloud credentials or
# network LLM calls: every test uses the mock model (LLM_PROVIDER=mock).
jobs:
  app:
    name: lint, typecheck, unit, eval, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install workspaces
        run: npm ci
      - name: Lint (format + 400-line ceiling)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Golden trajectory + injection eval gate
        run: npm run eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 7
      - name: Build web and embed
        run: npm run build
      - name: Embed size budget
        run: npm run check:size:embed
      - name: Build Storybook
        run: npm run -w apps/web build-storybook
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full E2E suite (mock model)
        run: |
          npx playwright test
          npx playwright test -c playwright.embed.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
